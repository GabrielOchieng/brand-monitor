services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brandmonitor
      POSTGRES_PASSWORD: brandmonitor
      POSTGRES_DB: brandmonitor
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  scanner:
    build:
      context: ./apps/scanner
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: 3100

volumes:
  pgdata:
